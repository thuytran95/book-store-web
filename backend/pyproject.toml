[project]
name = "bookstore-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "apscheduler>=3.10",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042", "UP046", "B008"]

[tool.uv]
package = false
